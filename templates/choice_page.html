<title>專案選擇頁</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- DIRECTOR-WORK templates/choice_page.html：使用者的選擇頁（docs/12）。總監用 Artifact 工具發布，capabilities {"db":{},"user":{},"assets":{},"comments":{}}。
     資料都在 db，不寫進本檔：brief/current（初衷卡摘要）、decisions/<id>（要使用者選的題）、notes（使用者給總監的話）；
     2.1 新題另用 choiceRevisions（每一版題目，不再改）、choiceReplies（每次送出一筆）、choiceReceipts（總監的收件和處理回條）。欄位見 docs/12 第四節。
     不漏讀（docs/12 第六節）：存好後用 comments.sendToClaude 叫醒總監，只說有新回覆；頁面分開標「沒收到」和「收到但卡住」。 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one reading column. The locked brief sits on top like a pinned card; open choices follow, each option a picture card side by side; answered and closed below. */
:root{
  --bg:#f4f4f0; --surface:#ffffff; --ink:#1f2421; --muted:#5f6862; --line:#d9dcd5;
  --pin:#2d5b4f; --pin-soft:#e2eee9; --ask:#b5562a; --ask-soft:#f8e8de; --pick:#2b4f8a; --pick-soft:#e3eaf6;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121513; --surface:#1b201d; --ink:#e6eae6; --muted:#9ba59f; --line:#2e3631;
  --pin:#7cc0ab; --pin-soft:#1d2e29; --ask:#ec9a6f; --ask-soft:#3a2519; --pick:#8db4f0; --pick-soft:#1c2a40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121513; --surface:#1b201d; --ink:#e6eae6; --muted:#9ba59f; --line:#2e3631;
  --pin:#7cc0ab; --pin-soft:#1d2e29; --ask:#ec9a6f; --ask-soft:#3a2519; --pick:#8db4f0; --pick-soft:#1c2a40; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px;display:flex;flex-direction:column;gap:26px}
header{display:flex;flex-direction:column;gap:4px}
h1{margin:0;font-family:var(--display);font-size:1.7rem;font-weight:700;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.9rem}
h2{margin:0 0 10px;font-size:.78rem;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.brief{border:1px solid var(--pin);background:var(--pin-soft)}
.brief .meta{font-family:var(--mono);font-size:.75rem;color:var(--pin)}
.brief dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.brief dt{font-family:var(--mono);font-size:.78rem;color:var(--pin);padding-top:2px}
.brief dd{margin:0;min-width:0}
.brief .kind{color:var(--muted);font-size:.8rem;margin-right:6px}
.card.open{border-top:3px solid var(--ask)}
.card.answered{border-top:3px solid var(--pick)}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.code{font-family:var(--mono);font-size:.75rem;background:var(--ask-soft);color:var(--ask);padding:2px 7px;border-radius:4px}
.answered .code{background:var(--pick-soft);color:var(--pick)}
.closed .code{background:var(--pin-soft);color:var(--pin)}
.trace{font-family:var(--mono);font-size:.72rem;color:var(--pin);border:1px solid var(--pin);padding:0 6px;border-radius:999px}
.title{margin:0;font-weight:700;font-size:1.05rem}
.q{margin:0}
.ctx{margin:0;color:var(--muted);font-size:.88rem;white-space:pre-line}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--pick)}
.opt[aria-pressed="true"]{border-color:var(--pick);background:var(--pick-soft)}
.opt img{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:var(--surface)}
.opt .ol{font-weight:700}
.opt .od{font-size:.85rem;color:var(--muted)}
.rec{display:inline-block;font-size:.7rem;font-weight:700;color:var(--ask);margin-left:6px;letter-spacing:.06em}
.why{margin:0;font-size:.85rem;background:var(--ask-soft);border-radius:8px;padding:8px 10px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.shot{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.shot img,.shot video{width:100%;height:auto;border-radius:6px;border:1px solid var(--line);display:block}
.shot figcaption{font-size:.8rem;color:var(--muted)}
textarea{width:100%;box-sizing:border-box;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.send{border:0;border-radius:8px;padding:9px 18px;font:inherit;font-weight:700;background:var(--pin);color:var(--surface);cursor:pointer}
.send:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ask);outline-offset:2px}
.msg{font-size:.85rem;color:var(--muted)}
.ans{font-size:.9rem;background:var(--pick-soft);border-radius:8px;padding:8px 10px;white-space:pre-line}
.seen{font-size:.8rem;color:var(--pick)}
.late{font-size:.85rem;color:var(--ask);background:var(--ask-soft);border-radius:8px;padding:6px 10px}
.res{font-size:.9rem;background:var(--pin-soft);border-radius:8px;padding:8px 10px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted)}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem;font-weight:700;letter-spacing:.06em}
details .list{margin-top:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<main class="wrap">
  <header>
    <h1 id="name">專案選擇頁</h1>
    <p class="sub">總監要你決定的事都在這裡。點一個選項、按送出就好。送出後會先存在這一頁；總監收到、處理完，下面都會標出來。</p>
    <p class="msg" id="status">正在讀取…</p>
  </header>

  <section aria-labelledby="h-brief">
    <h2 id="h-brief">專案初衷卡</h2>
    <div id="brief" class="empty">還沒有初衷卡。總監和你談完需求、你確認之後，會顯示在這裡。</div>
  </section>

  <section aria-labelledby="h-open">
    <h2 id="h-open">等你選</h2>
    <div class="list" id="open"></div>
  </section>

  <section aria-labelledby="h-ans">
    <h2 id="h-ans">你已回覆</h2>
    <div class="list" id="answered"></div>
  </section>

  <section aria-labelledby="h-note">
    <h2 id="h-note">給總監的話</h2>
    <div class="card">
      <label for="note-text" class="msg">想改需求、想加什麼、哪裡看起來不對，寫在這裡。初衷卡只有你能改：要改就寫在這裡，總監會改好再請你確認。</label>
      <textarea id="note-text" placeholder="例如：主角的顏色想再亮一點"></textarea>
      <div class="row"><button class="send" id="note-send" type="button">送出</button><span class="msg" id="note-msg"></span></div>
      <div class="list" id="notes"></div>
    </div>
  </section>

  <details>
    <summary>已結案（最近 15 項）</summary>
    <div class="list" id="closed"></div>
  </details>
</main>

<script>
/* 2.1：每一區自己重畫（renderOpenList / renderAnsweredList / renderClosedList / renderNotesList / renderBrief），資料回呼只重畫自己那區。
   等你選的區重畫前後保留補充文字、選取範圍、方向、捲動和焦點；中文組字中先不重畫。送出時每題一把鎖（S.inFlight），用當下的選項再檢查一次。 */
const S={db:null,comments:null,canWrite:true,decisions:[],revisions:{},revLoaded:false,revError:false,replies:[],receipts:[],notes:[],brief:null,loaded:false,
  picks:{},drafts:{},subIds:{},inFlight:{},msgs:{},sent:{},firstSeen:{},composing:false,deferOpen:false,openSig:null,noteBusy:false,noteSubs:{}};
/* 2.2：回覆和留言都帶「頁面來源」。帳本的冪等鍵 = 頁面來源 + 事件種類（kind）+ submissionId。 */
const PAGE_SOURCE=(function(){try{return String(location.origin)+String(location.pathname)}catch(e){return""}})()||"choice-page";
const PAGE_VERSION="2.2.0";
const LATE_MIN=10,STUCK_MIN=30;
const STAGE={seen:1,claimed:1,handed:2,closed:3};
const $=id=>document.getElementById(id);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function fmt(iso){if(!iso)return"";try{return new Date(iso).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}catch(e){return iso}}
function optLabel(d,key){const o=(d.options||[]).find(o=>o.key===key);return o?o.label:key}
function traces(d,h){(d.brief||[]).forEach(b=>h.append(el("span","trace",b)))}
function docs(snap){return snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}))}
function newId(){try{return crypto.randomUUID()}catch(e){return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2)}}
function minsSince(iso){const t=Date.parse(iso||"");return isNaN(t)?null:Math.floor((Date.now()-t)/60000)}

/* 題目的版本：有 revision 的是 2.1 新題，內容取 choiceRevisions 裡不會再改的那一版；舊題用題目內容的指紋，同編號改了內容就當新的一題，不沿用舊選擇。 */
function fp(d){return JSON.stringify([d.title||"",d.question||"",(d.options||[]).map(o=>[o.key,o.label||"",o.desc||""])])}
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)}
/* 2.2：登記的指紋 = decisions 上的 snapshotHash。版本文件的指紋和它不同（或沒有登記）時，這一版的文字和選項一律不採用、不能送出。 */
function viewOf(d){
  if(d.revision!=null){const found=S.revisions[d.id+"@"+d.revision],snap=found||{},reg=d.snapshotHash||"";
    const state=!found?(S.revError||S.revLoaded?"missing":"loading"):!reg?"nohash":snap.snapshotHash!==reg?"hash":"ok";
    const base=state==="ok"?snap:{};
    return{...d,...base,options:state==="ok"?(snap.options||[]):[],id:d.id,status:d.status,revision:d.revision,snapshotHash:reg,v2:true,snap:state,key:d.id+"@r"+d.revision}}
  return{...d,v2:false,key:d.id+"@"+hashStr(fp(d))}}
/* 2.2：一筆回覆跟這一版的關係。valid = 同題同版、指紋和登記的一樣、有 submissionId；缺指紋或缺 submissionId 的舊格式是 legacy，不算有效回覆；同版但指紋不對是 bad；別的版是 prior。 */
function relOf(r,v){
  if(r.revision==null||!r.submissionId||!r.snapshotHash)return"legacy";
  if(r.revision!==v.revision)return"prior";
  if(!v.snapshotHash||r.snapshotHash!==v.snapshotHash)return"bad";
  return"valid"}
/* 回條只配給「總監採用」的那一筆：questionId + revision + submissionId 都對得上（回條若有 snapshotHash 也要一樣）。沒有 submissionId 的舊回條，只有在有效回覆剛好一筆時才配；配不上的算 stray，只當歷史。 */
function receiptsFor(v,valid){
  let best=null,stray=0;
  S.receipts.filter(r=>r.questionId===v.id&&r.revision===v.revision).forEach(r=>{
    const target=r.submissionId?valid.find(x=>x.submissionId===r.submissionId):valid.length===1?valid[0]:null;
    if(!target||(r.snapshotHash&&r.snapshotHash!==v.snapshotHash)){stray++;return}
    if(!best||(STAGE[r.stage]||0)>(STAGE[best.rc.stage]||0))best={rc:r,reply:target}});
  return{best,stray}}
function stateOf(d){
  const v=viewOf(d);
  if(!v.v2){let state=d.status==="closed"?"closed":d.status==="answered"?"answered":d.status==="open"?"open":"other";
    const local=S.sent[v.key];if(state==="open"&&local)state="answered";
    return{v,state,answer:d.answer||local||null,seenAt:d.seenAt||null,doneAt:d.status==="closed"?d.closedAt||null:null,resolution:d.resolution||"",receipt:null,extra:0,prior:[],adopted:false,rejected:{bad:0,legacy:0},stray:0}}
  const reps=S.replies.filter(r=>r.kind!=="note"&&r.questionId===v.id).sort((a,b)=>String(a.clientAt).localeCompare(String(b.clientAt))||String(a.submissionId).localeCompare(String(b.submissionId)));
  const valid=reps.filter(r=>relOf(r,v)==="valid"),prior=reps.filter(r=>relOf(r,v)==="prior");
  const rejected={bad:reps.filter(r=>relOf(r,v)==="bad").length,legacy:reps.filter(r=>relOf(r,v)==="legacy").length};
  const {best,stray}=receiptsFor(v,valid),rc=best&&best.rc;
  const answer=(best&&best.reply)||valid[0]||S.sent[v.key]||null;
  const closed=d.status==="closed"||!!(rc&&rc.stage==="closed");
  return{v,state:closed?"closed":answer?"answered":d.status==="open"?"open":"other",answer,adopted:!!best,rejected,stray,
    seenAt:rc&&(STAGE[rc.stage]||0)>=1?rc.at:null,doneAt:rc&&(STAGE[rc.stage]||0)>=2?rc.at:null,
    resolution:d.resolution||(rc&&rc.resolution)||"",receipt:rc,extra:Math.max(0,valid.length-(valid.length?1:0)),
    prior:prior.map(r=>({revision:r.revision,label:r.selectedOptionSnapshot?r.selectedOptionSnapshot.label:r.choice}))}}
/* 你當時選的字：新題用送出時存下的選項；舊題當時的選項沒有留下來，只能用現在的選項文字，並照實標出。 */
function choiceText(st){const a=st.answer||{};if(a.choice==="done")return"已讀";
  if(a.selectedOptionSnapshot)return a.selectedOptionSnapshot.label||a.choice;
  return optLabel(st.v,a.choice)+"（舊題，當時選項未留存；這是現在的選項文字）"}

/* 叫醒總監：資料存進 db 之後才呼叫，只說「有新回覆／新留言」和題號，不帶你寫的內容。anchor 用一直在頁面上的標題，不用會被重畫掉的按鈕。失敗不影響已存的回覆。 */
async function anchorOf(node){try{return S.comments&&node?await S.comments.anchorFor(node):null}catch(e){return null}}
async function notify(anchor,text){
  const later="總監下一輪會讀到；沒有人開始下一輪時不會被讀到，請在聊天提醒總監";
  if(!S.comments||!anchor)return later;
  try{if(await S.comments.canSendToClaude()!=="available")return later;
    await S.comments.sendToClaude({anchor,text:text.slice(0,300)});return"已通知總監"}
  catch(e){return later}}

function renderBrief(){
  const box=$("brief");const b=S.brief;
  if(b&&b.name){$("name").textContent=b.name;document.title=b.name+" 選擇頁"}
  if(!b||!Array.isArray(b.items)||!b.items.length)return;
  const c=el("div","card brief");
  c.append(el("p","meta",(b.status==="LOCKED"?"已鎖定":"草稿，等你確認")+"｜第 "+(b.version||1)+" 版"+(b.lockedAt?"｜"+fmt(b.lockedAt):"")));
  if(b.summary)c.append(el("p","q",b.summary));
  const dl=el("dl");
  b.items.forEach(i=>{dl.append(el("dt",null,i.id));const dd=el("dd");if(i.kind)dd.append(el("span","kind",i.kind));dd.append(document.createTextNode(i.text||""));dl.append(dd)});
  c.append(dl);box.className="";box.replaceChildren(c)}

function media(list){
  const g=el("div","gallery");
  list.forEach(im=>{const f=el("figure","shot");const url=safeUrl(im&&im.url);
    if(!url)f.append(el("p","late","這張圖的網址不安全，沒有顯示。"));
    else if(im.kind==="video"){const v=el("video");v.src=url;v.controls=true;v.preload="metadata";v.playsInline=true;f.append(v)}
    else{const a=el("a");a.href=url;a.target="_blank";a.rel="noopener";const i=el("img");i.src=url;i.alt=im.caption||"";i.loading="lazy";a.append(i);f.append(a)}
    if(im.caption)f.append(el("figcaption",null,im.caption));g.append(f)});
  return g}

/* db 裡的網址只接受 https:、/_blob/ 和相對路徑；javascript:、data:、http: 和 //別站 一律不放進 src / href。 */
function safeUrl(u){const s=String(u||"").trim();if(!s||/[\u0000-\u001f\\]/.test(s))return"";
  if(/^https:\/\//i.test(s)||s.startsWith("/_blob/"))return s;
  if(s.startsWith("//")||/^[a-z][a-z0-9+.-]*:/i.test(s))return"";return s}
function pickOk(v){const opts=v.options||[];return!opts.length||opts.some(o=>o.key===S.picks[v.key])}
function sendBlocked(v){return!S.canWrite||!!S.inFlight[v.id]||(v.v2&&v.snap!=="ok")||!pickOk(v)}
/* 2.1 新題的選項在 choiceRevisions；還沒讀到就不能送，免得送成空的「我知道了」。 */
function snapNote(v){return!v.v2||v.snap==="ok"?"":v.snap==="loading"?"載入中…選項讀到後才能送出。":v.snap==="hash"||v.snap==="nohash"?"這一版的選項和總監登記的快照對不上（"+(v.snap==="nohash"?"沒有登記指紋":"指紋不同")+"），暫時不能送出，這一版的文字也不採用。請在聊天告訴總監。":"這一版選項讀不到，請在聊天告訴總監。"}
/* 這一版有幾筆回覆不算數：同版但指紋對不上（bad），或缺指紋／回覆編號的舊格式（legacy）。題目仍開著，不會因此被藏起來。 */
function rejectNote(st){const r=st.rejected,out=[];
  if(r.bad)out.push(r.bad+" 筆這一版的回覆指紋和登記的不一樣，不算數");
  if(r.legacy)out.push(r.legacy+" 筆回覆缺指紋或回覆編號（舊格式），總監要另外確認才算數");
  return out.length?"另有 "+out.join("；")+"。":""}
/* 按選項、送出開始和結束都只更新這張卡的按鈕和訊息，不重畫整區。 */
function refreshCard(v){
  const c=$("open").querySelector('article[data-key="'+CSS.escape(v.key)+'"]');if(!c)return;
  c.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed",b.dataset.opt===S.picks[v.key]?"true":"false"));
  const s=c.querySelector(".send");if(s)s.disabled=sendBlocked(v);
  const m=c.querySelector(".msg[data-role=msg]");if(m)m.textContent=S.msgs[v.key]||""}

// drafts are kept by d.key (id + revision), not by S.drafts[d.id] alone, so a draft never moves to a changed question
function renderOpen(st){
  const d=st.v;const c=el("article","card open");c.dataset.key=d.key;c.dataset.id=d.id;
  const h=el("div","head");h.append(el("span","code",d.code||d.id));traces(d,h);
  c.append(h,el("p","title",d.title||""));
  if(d.question)c.append(el("p","q",d.question));
  if(d.context)c.append(el("p","ctx",d.context));
  if(snapNote(d))c.append(el("p","late",snapNote(d)));
  if(rejectNote(st))c.append(el("p","late",rejectNote(st)+"題目還開著，請再選一次。"));
  st.prior.forEach(p=>c.append(el("p","late","你在第 "+p.revision+" 版選過「"+p.label+"」，後來題目改版了，請照現在的選項再選一次。")));
  Object.keys(S.drafts).forEach(k=>{if(k!==d.key&&k.startsWith(d.id+"@")&&S.drafts[k])c.append(el("p","late","題目更新了。你在舊版寫的補充（還沒送出）："+S.drafts[k]))});
  if(Array.isArray(d.images)&&d.images.length)c.append(media(d.images));
  const opts=el("div","opts");
  (d.options||[]).forEach(o=>{
    const b=el("button","opt");b.type="button";b.dataset.opt=o.key;b.dataset.focus="o:"+d.key+":"+o.key;
    b.setAttribute("aria-pressed",S.picks[d.key]===o.key?"true":"false");
    if(o.image&&safeUrl(o.image.url)){const i=el("img");i.src=safeUrl(o.image.url);i.alt=o.image.caption||o.label||"";i.loading="lazy";b.append(i)}
    const l=el("span","ol",o.label);if(d.recommended===o.key)l.append(el("span","rec","總監建議"));
    b.append(l);if(o.desc)b.append(el("span","od",o.desc));
    b.addEventListener("click",()=>{S.picks[d.key]=o.key;refreshCard(d)});
    opts.append(b)});
  if((d.options||[]).length)c.append(opts);
  if(d.recommended&&d.why)c.append(el("p","why","總監為什麼建議「"+optLabel(d,d.recommended)+"」："+d.why));
  const ta=el("textarea");ta.id="note-"+d.id;ta.dataset.key=d.key;ta.dataset.focus="t:"+d.key;ta.placeholder="想補充的話（可以不寫）";ta.value=S.drafts[d.key]||"";
  ta.addEventListener("input",()=>{S.drafts[d.key]=ta.value});c.append(ta);
  const row=el("div","row");const send=el("button","send",(d.options||[]).length||d.v2&&d.snap!=="ok"?"送出選擇":"我知道了");send.type="button";send.dataset.focus="s:"+d.key;
  send.disabled=sendBlocked(d);
  const msg=el("span","msg",S.msgs[d.key]||"");msg.dataset.role="msg";row.append(send,msg);c.append(row);
  send.addEventListener("click",()=>submitChoice(d.id));
  return c}

/* 重畫前記下每個補充框的字、選取範圍、方向、捲動，和焦點在哪個元素；重畫後放回同一版的同一題。 */
function captureDrafts(){
  const f=document.activeElement,box=$("open");
  const fields=[...box.querySelectorAll("textarea[data-key]")].map(t=>{S.drafts[t.dataset.key]=t.value;
    return{key:t.dataset.key,value:t.value,start:t.selectionStart,end:t.selectionEnd,dir:t.selectionDirection,scroll:t.scrollTop,focused:t===f}});
  return{fields,focus:f&&box.contains(f)&&f.dataset?f.dataset.focus||null:null}}
function restoreDrafts(saved){
  const box=$("open");
  saved.fields.forEach(s=>{const t=box.querySelector('textarea[data-key="'+CSS.escape(s.key)+'"]');if(!t)return;
    if(t.value!==s.value)t.value=s.value;t.scrollTop=s.scroll;
    if(s.focused){t.focus({preventScroll:true});try{t.setSelectionRange(s.start,s.end,s.dir)}catch(e){}}});
  if(saved.focus&&!saved.fields.some(s=>s.focused)){const n=box.querySelector('[data-focus="'+CSS.escape(saved.focus)+'"]');if(n)n.focus({preventScroll:true})}}

function renderOpenList(){
  if(S.composing&&!$("open").contains(document.activeElement))S.composing=false;
  if(S.composing){S.deferOpen=true;return}
  const open=S.decisions.map(stateOf).filter(st=>st.state==="open").sort((a,b)=>(a.v.priority??9)-(b.v.priority??9));
  const sig=JSON.stringify(open.map(st=>[st.v,st.prior,st.rejected]));
  if(sig===S.openSig){open.forEach(st=>refreshCard(st.v));return}
  S.openSig=sig;
  const saved=captureDrafts();
  const O=$("open");O.replaceChildren(...open.map(renderOpen));if(!open.length)O.append(el("div","empty","現在沒有要你選的。總監有新問題時會放在這裡。"));
  restoreDrafts(saved)}

/* 三種狀態：已儲存，等總監讀取 → 總監已收件，處理中 → 已交接／處理完成。逾時分開「沒收到」和「收到但卡住」。 */
function renderAnswered(st){
  const d=st.v;const c=el("article","card answered");const h=el("div","head");h.append(el("span","code",d.code||d.id));traces(d,h);c.append(h,el("p","title",d.title||""));
  const a=st.answer||{};const at=a.at||a.clientAt;
  if(!S.firstSeen[d.key])S.firstSeen[d.key]=new Date().toISOString();
  c.append(el("div","ans","你選了："+choiceText(st)+(a.note?"\n補充："+a.note:"")+"\n（"+(at?fmt(at):"送出時間不明")+"）"));
  if(st.doneAt){c.append(el("p","seen","已交接／處理完成（"+fmt(st.doneAt)+"）"+(st.receipt&&st.receipt.wo?"："+st.receipt.wo:"")))}
  else if(st.seenAt){c.append(el("p","seen","總監已收件，處理中（"+fmt(st.seenAt)+"）"));
    const m=minsSince(st.seenAt);if(m!=null&&m>=STUCK_MIN)c.append(el("p","late","總監收到已經 "+m+" 分鐘，還沒處理完（收到但卡住）。可以在聊天裡問總監卡在哪一步。"))}
  else{c.append(el("p","seen","已儲存，等總監讀取"));
    const m=minsSince(at)??minsSince(S.firstSeen[d.key]);
    if(m!=null&&m>=LATE_MIN)c.append(el("p","late","已經 "+m+" 分鐘，總監還沒收到（沒收到）。可以在聊天裡跟總監說一聲。"))}
  if(st.extra>0)c.append(el("p","msg",st.adopted?"這題另外還有 "+st.extra+" 筆有效回覆（例如別的分頁送的），總監採用的是上面這一筆。":"這題另外還有 "+st.extra+" 筆有效回覆（例如別的分頁送的），總監只會採用一筆，採用前上面這一筆只是你最早送的。"));
  if(rejectNote(st))c.append(el("p","msg",rejectNote(st)));
  if(st.stray>0)c.append(el("p","msg","另有 "+st.stray+" 筆回條對不到你送出的任何一筆，只當歷史紀錄，不代表上面這筆已處理。"));
  return c}

function renderAnsweredList(){
  const ans=S.decisions.map(stateOf).filter(st=>st.state==="answered");
  const A=$("answered");A.replaceChildren(...ans.map(renderAnswered));if(!ans.length)A.append(el("div","empty","沒有等總監處理的回覆。"))}

function renderClosed(st){
  const d=st.v;const c=el("article","card closed");const h=el("div","head");h.append(el("span","code",d.code||d.id));c.append(h,el("p","title",d.title||""));
  const a=st.answer||{};if(a.choice)c.append(el("p","msg","你的回覆："+choiceText(st)+(a.note?"｜"+a.note:"")));
  if(st.resolution)c.append(el("div","res","總監處理："+st.resolution));return c}

function renderClosedList(){
  const closed=S.decisions.map(stateOf).filter(st=>st.state==="closed").sort((a,b)=>String(b.v.closedAt||"").localeCompare(String(a.v.closedAt||""))).slice(0,15);
  const C=$("closed");C.replaceChildren(...closed.map(renderClosed));if(!closed.length)C.append(el("div","empty","還沒有結案的項目。"))}

function renderNotesList(){
  const N=$("notes");const notes=S.notes.slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,5);
  N.replaceChildren(...notes.map(n=>el("p","msg",fmt(n.at)+"｜"+(n.status==="read"?"總監已讀｜":"已儲存，等總監讀取｜")+n.text)))}

function renderDecisions(){renderOpenList();renderAnsweredList();renderClosedList()}

/* 送出一題：同一題同時只送一筆；送之前用最新的資料再檢查一次這題還開著、選的選項還在。失敗時選擇和補充都留著，重試沿用同一個 submissionId。 */
async function submitChoice(id){
  if(S.inFlight[id])return;
  const d=S.decisions.find(x=>x.id===id);const st=d&&stateOf(d);
  if(!st||st.state!=="open"){renderDecisions();return}
  const v=st.v,key=v.key;
  /* 2.2：新題的選項只從登記過、指紋對得上的快照重建，不用頁面上別處的文字。 */
  const reg=v.v2?S.revisions[id+"@"+v.revision]||{}:null;
  const opts=v.v2?(v.snap==="ok"&&reg.snapshotHash===v.snapshotHash?reg.options||[]:[]):v.options||[];
  if(v.v2&&v.snap!=="ok"){S.msgs[key]=snapNote(v);refreshCard(v);return}
  const choice=opts.length?S.picks[key]:"done";const opt=opts.find(o=>o.key===choice);
  if(opts.length&&!opt){S.msgs[key]="你選的選項已經不在了，請重新選";delete S.picks[key];refreshCard(v);return}
  const raw=S.drafts[key]||"",note=raw.trim(),at=new Date().toISOString();
  /* 同一次送出（網路重試）才沿用 submissionId；選項或補充變了就是新的一次，不能拿同一個編號送不同內容。 */
  const sig=JSON.stringify([choice,note]);
  if(!S.subIds[key]||S.subIds[key].sig!==sig)S.subIds[key]={sig,id:newId()};
  const submissionId=S.subIds[key].id;
  S.inFlight[id]=submissionId;S.msgs[key]="儲存中…";refreshCard(v);
  const anchor=anchorOf($("h-open"));
  const snap=opt?{key:opt.key,label:opt.label||"",desc:opt.desc||""}:null;
  try{
    if(v.v2)await S.db.collection("choiceReplies").add({kind:"choice",submissionId,questionId:id,revision:v.revision,snapshotHash:v.snapshotHash,
      choice,selectedOptionSnapshot:snap,note,clientAt:at,pageSource:PAGE_SOURCE,pageVersion:PAGE_VERSION});
    else await S.db.doc("decisions/"+id).update({status:"answered",answer:{choice,note,at,submissionId,pageSource:PAGE_SOURCE}});
    S.sent[key]=v.v2?{choice,note,clientAt:at,submissionId,revision:v.revision,selectedOptionSnapshot:snap}:{choice,note,at,submissionId};
    if(S.drafts[key]===raw)delete S.drafts[key];
    Object.keys(S.drafts).forEach(k=>{if(k!==key&&k.startsWith(id+"@"))delete S.drafts[k]});
    delete S.subIds[key];delete S.picks[key];delete S.msgs[key];delete S.inFlight[id];
    renderDecisions();
    const told=await notify(await anchor,"選擇頁有新回覆："+(v.code||id)+(v.v2?"（第 "+v.revision+" 版）":"")+"。請照 docs/12 讀選擇頁處理。");
    $("status").textContent=(v.code||id)+" 已儲存，"+told}
  catch(e){delete S.inFlight[id];
    S.msgs[key]=e&&(e.code==="permission_denied"||e.code==="invalid_argument")?"你沒有這一頁的寫入權限":"送出失敗，你的選擇和補充都還在，請稍後再按一次";refreshCard(v)}}

/* 留言：送出中不能再按；存好後只有框裡的字沒被改過才清空，送出中續打的字留著。 */
async function sendNote(){
  if(S.noteBusy)return;const box=$("note-text");const raw=box.value;const t=raw.trim();if(!t)return;
  S.noteBusy=true;$("note-send").disabled=true;$("note-msg").textContent="儲存中…";
  const anchor=anchorOf($("h-note"));
  /* 同樣的字重送就沿用同一個 submissionId（改了又改回來也一樣）；存好了才清掉。 */
  const submissionId=S.noteSubs[raw]||(S.noteSubs[raw]=newId());
  try{await S.db.collection("notes").add({kind:"note",submissionId,text:t,at:new Date().toISOString(),status:"new",pageSource:PAGE_SOURCE,pageVersion:PAGE_VERSION});
    S.noteSubs={};if(box.value===raw)box.value="";$("note-msg").textContent="已儲存，等總監讀取";
    $("note-msg").textContent="已儲存，"+await notify(await anchor,"選擇頁有新留言。請照 docs/12 讀選擇頁處理。")}
  catch(e){$("note-msg").textContent="送出失敗，你寫的字還在，請稍後再試"}
  S.noteBusy=false;$("note-send").disabled=!S.canWrite}

document.addEventListener("compositionstart",()=>{S.composing=true});
function endComposing(){S.composing=false;if(S.deferOpen){S.deferOpen=false;renderOpenList()}}
document.addEventListener("compositionend",endComposing);
document.addEventListener("focusout",()=>{if(S.composing)endComposing()});

async function init(){
  const db=await claude.use("db");
  if(!db){$("status").textContent="這個檢視讀不到資料。請登入 claude.ai 後再開這一頁。";return}
  S.db=db;
  try{const user=await claude.use("user");if(user&&user.can){const w=await Promise.resolve(user.can("data.write"));if(w===false)S.canWrite=false}}catch(e){}
  if(!S.canWrite)$("note-send").disabled=true;
  try{S.comments=await claude.use("comments")}catch(e){}
  setInterval(renderAnsweredList,60000);
  const timer=setTimeout(()=>{if(!S.loaded)$("status").textContent="資料暫時連不上，連上後會自動更新。"},10000);
  db.collection("decisions").onSnapshot(snap=>{S.decisions=docs(snap);
    if(!snap.metadata||!snap.metadata.fromCache){S.loaded=true;clearTimeout(timer);$("status").textContent="最後同步："+fmt(new Date().toISOString())}renderDecisions()},
    e=>{clearTimeout(timer);$("status").textContent="讀取失敗（"+(e&&e.code||"原因不明")+"），請重新開這一頁。"});
  db.collection("choiceRevisions").onSnapshot(snap=>{const m={};docs(snap).forEach(r=>{m[r.questionId+"@"+r.revision]=r});S.revisions=m;
    if(!snap.metadata||!snap.metadata.fromCache)S.revLoaded=true;renderDecisions()},()=>{S.revError=true;renderDecisions()});
  db.collection("choiceReplies").onSnapshot(snap=>{S.replies=docs(snap);renderDecisions()},()=>{});
  db.collection("choiceReceipts").onSnapshot(snap=>{S.receipts=docs(snap);renderDecisions()},()=>{});
  db.doc("brief/current").onSnapshot(snap=>{S.brief=snap.exists?snap.data():null;renderBrief()},()=>{});
  db.collection("notes").onSnapshot(snap=>{S.notes=docs(snap);renderNotesList()},()=>{});
  $("note-send").addEventListener("click",sendNote);
}
renderBrief();renderDecisions();renderNotesList();init();
</script>
