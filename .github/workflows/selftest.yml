# Runs tools/selftest.py, the same check run locally before every commit (tools/README.md).
# Third-party actions are pinned to a commit SHA; the comment names the release.
name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -I -X utf8 tools/selftest.py
      # 2.1.0 (report 5): the rules pack must also verify where git is missing (a ZIP on a bare machine).
      # Take every PATH folder holding git off PATH; the git test groups are then skipped by name, the rest must pass.
      - name: selftest without git on PATH
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'git.exe')) -and -not (Test-Path (Join-Path $_ 'git.cmd')) }) -join ';'
          if (Get-Command git -ErrorAction SilentlyContinue) { throw 'git is still on PATH' }
          python -I -X utf8 tools/selftest.py
